name: Update p_23.lua SHA256

on:
  push:
    paths:
      - "p_23.lua"

permissions:
  contents: write

jobs:
  sha256:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculate SHA256
        run: sha256sum p_23.lua > p_23.lua.sha256

      - name: Commit SHA256
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add p_23.lua.sha256

          if git diff --cached --quiet; then
            echo "SHA256 has not changed"
            exit 0
          fi

          git commit -m "Update p_23.lua SHA256"
          git push
